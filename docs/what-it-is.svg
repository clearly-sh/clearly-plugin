<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 260" width="880" height="260" role="img" aria-label="Your agent talks to the Clearly workspace over MCP: documents, projects and tickets addressed as a filesystem, plus a spatial canvas.">
  <title>Clearly over MCP</title>
  <defs>
    <style>
      .b { fill:#FBFBFC; stroke:#D8D8DE; stroke-width:1.5; rx:10 }
      .h { font:600 15px ui-sans-serif,-apple-system,"Segoe UI",Inter,sans-serif; fill:#18181B }
      .s { font:400 12.5px ui-sans-serif,-apple-system,"Segoe UI",Inter,sans-serif; fill:#71717A }
      .m { font:500 12px ui-monospace,SFMono-Regular,Menlo,monospace; fill:#3F3F46 }
      .w { stroke:#A1A1AA; stroke-width:1.5; fill:none }
      @media (prefers-color-scheme: dark) {
        .b { fill:#141417; stroke:#2E2E35 }
        .h { fill:#FAFAFA } .s { fill:#A1A1AA } .m { fill:#D4D4D8 } .w { stroke:#52525B }
      }
    </style>
  </defs>
  <rect x="16"  y="74" width="212" height="112" class="b"/>
  <text x="36"  y="106" class="h">Your agent</text>
  <text x="36"  y="128" class="s">Claude Code · Desktop</text>
  <text x="36"  y="148" class="s">Cursor · any MCP client</text>
  <text x="36"  y="170" class="m">18 tools</text>

  <path d="M228 130 H 330" class="w"/>
  <path d="M320 124 l10 6 -10 6" class="w"/>
  <text x="246" y="120" class="m">MCP</text>
  <text x="238" y="152" class="s">OAuth · agent-bound</text>

  <rect x="338" y="20" width="250" height="100" class="b"/>
  <text x="358" y="50" class="h">Workspace as a filesystem</text>
  <text x="358" y="72" class="m">ls · grep · read · edit · write</text>
  <text x="358" y="94" class="s">documents, projects, tickets — versioned</text>

  <rect x="338" y="140" width="250" height="100" class="b"/>
  <text x="358" y="170" class="h">Spatial canvas</text>
  <text x="358" y="192" class="m">perceive · act</text>
  <text x="358" y="214" class="s">diagrams, diffs and maps as real nodes</text>

  <path d="M588 70 H 660 V 130" class="w"/>
  <path d="M588 190 H 660 V 130" class="w"/>
  <path d="M660 130 H 700" class="w"/>
  <path d="M690 124 l10 6 -10 6" class="w"/>

  <rect x="708" y="74" width="156" height="112" class="b"/>
  <text x="728" y="106" class="h">Your team</text>
  <text x="728" y="128" class="s">sees the same</text>
  <text x="728" y="146" class="s">workspace, live</text>
  <text x="728" y="170" class="m">clearly.sh</text>
</svg>
